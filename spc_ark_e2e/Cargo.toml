[package]
name = "spc_ark_e2e"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Regtest e2e: the spc-pool ark role (stock bark adapter) boards pool outputs and pays arkoor over a stock captaind"

# Standalone workspace, like spc_ark_client: the root workspace's
# [patch.crates-io] does not cross workspace boundaries, so the same
# bark pin (UPSTREAM_DEPS.md; decision record 2026-11-02-bark-adapter.md,
# clause 1) is restated at the bottom.
[workspace]

[dependencies]
# The crate under test: the ark role's wallet client, transport, board
# loop and pool output keychain. `ark` pulls the stock bark wallet at
# the pin; `rpc` the bitcoin-core-RPC board chain.
spc-pool = { path = "../bins/spc-pool", features = ["ark", "rpc"] }

[dev-dependencies]
# Same crate as spc-pool's, unified by the patch below.
ark-lib = "0.7.1"
# TestContext: spawns the stock captaind, bitcoind and postgres.
ark-testing = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "c419159fa54085572f8ca72d2ba1716556a9d3eb", package = "ark-testing" }
async-trait = "0.1"
# The miner wallet is an in-process stock bark::Wallet.
bark-wallet = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "c419159fa54085572f8ca72d2ba1716556a9d3eb", package = "bark-wallet", features = ["sqlite"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
# Mints the pool's coinbase and reads the cookie for the RPC chain.
bitcoincore-rpc = "0.19"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
ark-lib = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "c419159fa54085572f8ca72d2ba1716556a9d3eb", package = "ark-lib" }
