[package]
name = "spc-pool"
default-run = "spc-pool"
description = "silent-pool: SV1/SV2 pool, SPc coinbase, JD and Ark settlement roles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
postgres-integration = ["spc-store/postgres-integration"]
default = []
ark = ["spc-crypto/ark", "dep:bark-wallet", "dep:server_rpc", "dep:bdk_bitcoind_rpc", "rpc"]
rpc = ["dep:bitcoincore-rpc"]

[lib]
name = "spc_pool"
path = "src/lib.rs"

[[bin]]
name = "pool-wallet-executor"
path = "src/bin/pool-wallet-executor.rs"
required-features = ["ark"]

[dependencies]
spc-accounting.workspace = true
spc-crypto = { workspace = true, features = ["ark"] }
spc-ext.workspace = true
spc-scan.workspace = true
spc-share-ext.workspace = true
spc-store.workspace = true
anyhow.workspace = true
# Ark order verification parses `ark_address` with ark-lib (SPEC §11.3
# step 4); the crate is `ark`, the package `ark-lib` (same version as
# spc-crypto's optional `ark` feature).
ark-lib = "0.7.1"
# Stock bark wallet at the UPSTREAM_DEPS.md pin: the `ark` role's
# production transport (decision 2026-11-02-bark-adapter.md, clause 2).
# Optional so builds without the `ark` feature do not compile the bark
# tree; same rev as the workspace `[patch.crates-io] ark-lib` mapping.
# Default features give sqlite persistence and bitcoind-rpc chain;
# onchain-bdk is the BDK on-chain wallet board change goes to.
bark-wallet = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "c419159fa54085572f8ca72d2ba1716556a9d3eb", features = ["onchain-bdk"], optional = true }
# The server RPC client at the same pin. The thin arkoor send drives the
# cosign and mailbox RPCs itself (stock bark's send path is pub(crate)
# and returns no receipt); `bark-wallet` already unifies the transport
# and TLS features this crate needs, so defaults stay off here. The
# package is `bark-server-rpc`, its library crate `server_rpc`.
server_rpc = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "c419159fa54085572f8ca72d2ba1716556a9d3eb", package = "bark-server-rpc", default-features = false, optional = true }
async-trait = "0.1"
bitcoincore-rpc = { version = "0.19", optional = true }
bdk_bitcoind_rpc = { version = "0.22.1", optional = true }
axum = "0.8"
bitcoin.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
rustix.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
stratum-core = { version = "0.6.0", features = ["sv1"] }
stratum-apps = { version = "0.8", default-features = false, features = ["network", "core"] }
secp256k1_legacy = { package = "secp256k1", version = "0.28" }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ark-lib = { version = "0.7.1", features = ["test-util"] }
channels_sv2 = "8.0.0"
proptest.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# EXP-OP `operator_observation` tests follow the spc-store test
# convention (isolated `CREATE DATABASE` fixture per test) and need the
# same client stack as dev-deps there. Dev-deps only: nothing here
# affects the shipped binary or any other crate's build.
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
