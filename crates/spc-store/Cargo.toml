[package]
name = "spc-store"
description = "Postgres settlement store, Redis stream codecs and bootstrap snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
postgres-integration = []

[dependencies]
hex.workspace = true
bitcoin.workspace = true
spc-accounting.workspace = true
spc-crypto.workspace = true
spc-ext.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
