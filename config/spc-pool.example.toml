# Example `spc-pool` configuration (SPEC §6.3). Regtest/dev defaults.
# Start with: spc-pool --config config/spc-pool.example.toml

[pool]
network = "regtest"                 # mainnet is refused by v0.1
roles = ["front", "payout", "api"]
listen = "127.0.0.1:34254"          # SV2 (Noise)
# Throwaway base58check SV2 key-utils pair: replace both values together.
# The front refuses to start with an ephemeral or mismatched authority.
authority_public_key = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
authority_secret_key = "mkDLTBBRxdBv998612qipDYoTK3YUrqLe8uWw7gu3iXbSrn2n"
# Watch-only, structurally valid testnet tpub (throwaway): the pool output
# for height H is derived from it at H (SPEC §11.3).
pool_payout_descriptor = "tr(tpubD6NzVbkrYhZ4WUjXBVxZPvGhWxTRE5veAscTgokX65xcfCoDF5nyNdtaS4xGoJ7xnZuDTxCAEAnGpxJbWo6wtTAJsESmeJWpZzybZ6dvCia/0/*)"
# Dev-only override of the derived pool output script (hex, 34-byte P2TR).
# Leave it unset in production: the descriptor above is authoritative.
# pool_payout_script = "5120<32-byte tweaked key>"
fee_bps = 100
front_id = 0
outbox_max = 4096
tip_divergence_secs = 30

# Tor reach (SPEC §3.8). The Tor daemon owns onion keys and forwards to the
# listeners below; this binary never creates or manages onion services.
[reach]
# Published verbatim as `endpoints` at GET /api/pool. List every public
# endpoint, clearnet and onion alike:
# advertise = ["sv2://pool.example:34254", "sv2://<id>.onion:34254"]
advertise = []
# Per-listener advertised onion address. A non-empty entry REQUIRES that
# listener to bind a loopback address; spc-pool refuses to start otherwise
# (an onion service on a clearnet interface silently bypasses its privacy).
onion = { sv2 = "", sv1 = "", jd = "", api = "" }   # "<id>.onion:<port>"

# There is no [net] here: Tor egress covers mining connections only and is
# an spc-agent setting. The ark role dials the Ark server directly
# (decision 2026-11-04-tor-scope-mining-only).

[template]
source = "rpc"                      # "ipc" | "sv2-tp" | "rpc" | "mock"
rpc_url = "http://127.0.0.1:18443"
rpc_user = "user"
rpc_pass = "pass"
extranonce_bytes = 16
# How often the front polls for a new template (ms). Bounds how long an
# external new block leaves miner jobs and the JDS distribution stale.
refresh_interval_ms = 1000

[sv1]
enabled = true
listen = "127.0.0.1:3333"
extranonce1_bytes = 4
extranonce2_bytes = 4
vardiff = true

[accounting]
window_n = 8
# Pool share difficulty (SPEC §3.4, decision 2026-11-02-share-target-policy).
# Both ingresses accept shares at this difficulty's target (never harder than
# the network target), and the front credits
# `min(share_difficulty, max(1, round(network_difficulty)))` per share.
share_difficulty = 1
slice_fee_delta_sats = 0
max_slice_shares = 65000
dust_limit_sats = 330
coinbase_threshold_sats = 330
max_payout_slots = 1024             # 2048 is fee-spike headroom; never trim
retain_windows = 16
scrub_after_blocks = 100
confirmation_depth = 6
# Dev-only escape hatch (regtest/signet): allows template source "mock",
# payout without a chain view, and a front without redis. Never set it in
# production.
# allow_unchecked_chain = false

[budget]
floor_wu = 200000                  # covers the 990-output regtest reward
ceiling_wu = 1000000               # actual coinbase <= 25% of block weight
up_threshold = 0.85
down_threshold = 0.50
step_factor = 1.15
up_debounce = 3
down_debounce = 20
cooldown_secs = 300

[jd]
listen = "127.0.0.1:34264"
distribution_interval_secs = 60
distribution_rebalance_bps = 100
grace_same_height_only = true

[extensions]
share_accounting = true
window_hot_blocks = 6

[storage]
postgres = "postgres://spc:spc@127.0.0.1:5432/spc"
redis = "redis://127.0.0.1:6379"
front_cursor_heartbeat_secs = 30
front_cursor_ttl_secs = 120

[api]
listen = "127.0.0.1:8080"

# [operator]
# listen = "127.0.0.1:8081"   # EXP-OP: read-only operator page. Optional
#                              # and off unless set; loopback addresses only
#                              # (non-loopback is a config error); runs in
#                              # the same process as the api role, which the
#                              # roles list must therefore include. Serves
#                              # exactly /, /operator.css, /operator.js and
#                              # /api/pool/observation on its own listener,
#                              # separate from the public [api] router.

