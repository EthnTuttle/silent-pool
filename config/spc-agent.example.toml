# Example `spc-agent` configuration (SPEC §6.3, §11.10).

[upstream]
address = "127.0.0.1:34254"
authority_public_key = "02aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
sp_address = "tsp1q..."              # must parse at startup or the agent refuses
require_own_payout = "warn"          # "warn" | "refuse"
request_share_accounting = true

[downstream]
listen = "127.0.0.1:34255"           # stays plain TCP: ASIC firmware does not speak Tor

# STATUS: SPEC §3.8 - parser support lands with the Tor transport packet; this build rejects these keys.
# [net]                              # SPEC §3.8; covers upstream SV2, JDP and Ark/mailbox traffic
# proxy = ""                         # e.g. "socks5h://127.0.0.1:9050"; a .onion upstream with no proxy is a startup error
# stream_isolation = true

# [jd]                               # JDC role (SPEC §3.2, §3.5, §3.6)
# enabled = true
# jds_address = "127.0.0.1:34264"    # JDS listener in spc-pool [jd] listen
# tp_address = "127.0.0.1:48333"     # the miner's own Template Provider (reserved)
# scan_secret_key = "<64 hex chars>" # b_scan; MUST match sp_address
# height = 800000                    # template fields until a TP is wired
# coinbase_value = 5000000000        # coinbase_tx_value_remaining (T)
# extranonce_len = 8
# user_identifier = "spc-agent"      # AllocateMiningJobToken.user_identifier

# [ark]
# enabled = true
# mailbox_mode = "epoch_derived"
# epoch_fallback = "static"
# signer = "local"
# refresh_on_receive_above_sats = 0
# offboard_on_exit = ""
