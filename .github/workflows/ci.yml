name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Build binaries
        run: nix build --print-build-logs .#spc-pool .#spc-agent .#spc-scan
