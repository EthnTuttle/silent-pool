[workspace]
resolver = "2"
members = [
  "crates/spc-crypto",
  "crates/spc-accounting",
  "crates/spc-scan",
  "crates/spc-ext",
  "crates/spc-share-ext",
  "crates/spc-store",
  "crates/spc-testutil",
  "crates/spc-lab",
  "crates/spc-lab-txd",
  "bins/spc-pool",
  "bins/spc-agent",
  "bins/spc-cpu-miner",
  "bins/spc-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
repository = "https://github.com/average-gary/silent-pool"

[workspace.dependencies]
spc-crypto = { path = "crates/spc-crypto" }
spc-accounting = { path = "crates/spc-accounting" }
spc-scan = { path = "crates/spc-scan" }
spc-ext = { path = "crates/spc-ext" }
spc-share-ext = { path = "crates/spc-share-ext" }
spc-store = { path = "crates/spc-store" }
spc-testutil = { path = "crates/spc-testutil" }
spc-lab = { path = "crates/spc-lab" }
spc-pool = { path = "bins/spc-pool" }

anyhow = "1"
bech32 = "0.11"
bip39 = "2.2"
bitcoin = { version = "0.32", features = ["rand", "serde"] }
bs58 = { version = "0.4", features = ["check"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
num-bigint = "0.4"
proptest = "1"
rand = "0.8"
rustix = { version = "1.1", features = ["process", "fs"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = { version = "1", features = ["derive"] }

# The bark pin (UPSTREAM_DEPS.md): crates.io `ark-lib` 0.7.1 and the git
# crate at the pinned rev are the same package, so `Address`, `Vtxo` and
# `Keypair` types cross between spc-crypto, the pool's ark adapter and
# bark's own RPC bindings (decision 2026-11-02-bark-adapter.md, clause 1).
# The rev is the adopted testnet5 fork (stock c419159 + network-identity-only
# testnet5 support; decision 2026-11-17-bark-testnet5-fork.md). All bark
# crates move together so crate identity is preserved.
#
# `bitcoin` is patched to the adopted rust-bitcoin fork: 0.32.102 plus
# `Network::Testnet5` ported from upstream PR #7160 (UPSTREAM_DEPS.md
# "Adopted forks (2026-11-17)"). Pinned by rev for immutability.
[patch.crates-io]
ark-lib = { git = "https://github.com/EthnTuttle/bark", rev = "8c38e07ee70b046529a416b170f1ae5c77cc66a0" }
bitcoin = { git = "https://github.com/EthnTuttle/rust-bitcoin", rev = "cf4d11ca778fd86698ec7cc00bd081c15b12a2de" }
